<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | BasketStat Trends</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
    <style>
      .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: linear-gradient(135deg, var(--bg) 0%, #0d1117 100%);
      }
      
      .login-container {
        width: 100%;
        max-width: 400px;
      }
      
      .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 40px;
        text-align: center;
      }
      
      .login-logo {
        font-size: 48px;
        margin-bottom: 16px;
      }
      
      .login-title {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text);
      }
      
      .login-subtitle {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 32px;
      }
      
      .login-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      
      .login-input {
        width: 100%;
        padding: 14px 16px;
        font-size: 15px;
        font-family: inherit;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        color: var(--text);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      
      .login-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-dim);
      }
      
      .login-input::placeholder {
        color: var(--text-muted);
      }
      
      .login-btn {
        width: 100%;
        padding: 14px 24px;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all 0.2s ease;
      }
      
      .login-btn:hover:not(:disabled) {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }
      
      .login-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      
      .login-error {
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid rgba(248, 113, 113, 0.3);
        color: #f87171;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        display: none;
      }
      
      .login-error.visible {
        display: block;
      }
      
      .login-footer {
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-muted);
      }

      .login-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 24px 0;
        color: var(--text-muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .login-divider::before,
      .login-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .oauth-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .oauth-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
      }
      .oauth-btn:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }
      .oauth-btn svg { flex-shrink: 0; }
      .oauth-btn .vipps-badge {
        font-weight: 700;
        color: #ff5b24;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="login-page">
      <div class="login-container">
        <div class="login-card">
          <div class="login-logo">🏀</div>
          <h1 class="login-title">BasketStat Trends</h1>
          <p class="login-subtitle">Sign in to continue</p>
          
          <form class="login-form" id="loginForm">
            <input 
              type="email" 
              class="login-input" 
              id="emailInput" 
              placeholder="Email address" 
              autocomplete="email"
              required
            />
            <input 
              type="password" 
              class="login-input" 
              id="passwordInput" 
              placeholder="Password" 
              autocomplete="current-password"
              required
            />
            <div class="login-error" id="loginError">
              Incorrect password. Please try again.
            </div>
            <div class="login-error" id="adminError" style="display: none;">
              Admin access required. Please sign in with admin password.
            </div>
            <button type="submit" class="login-btn" id="loginBtn">
              Sign In
            </button>
          </form>

          <div class="login-divider" id="oauthDivider" style="display: none;">or</div>
          <div class="oauth-buttons" id="oauthButtons"></div>
          
          <div class="login-footer">
            Player performance tracking & analytics
          </div>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');
      const loginBtn = document.getElementById('loginBtn');
      const loginError = document.getElementById('loginError');
      const adminError = document.getElementById('adminError');
      
      const urlParams = new URLSearchParams(window.location.search);
      const redirectUrl = urlParams.get('redirect') || '/';
      const requiresAdmin = urlParams.get('error') === 'admin_required';
      
      // Show admin error if redirected due to insufficient permissions
      if (requiresAdmin) {
        adminError.style.display = 'block';
      }

      // Map OAuth/redirect error codes to friendly messages
      const ERROR_MESSAGES = {
        not_invited: 'That account has not been granted access. Ask an administrator to add your email first.',
        account_disabled: 'This account has been disabled. Please contact an administrator.',
        oauth_no_email: 'Your provider did not share an email address, which is required to sign in.',
        oauth_denied: 'Sign-in was cancelled.',
        oauth_unavailable: 'That sign-in method is not available.',
        oauth_state: 'Your sign-in session expired. Please try again.',
        oauth_error: 'Something went wrong during sign-in. Please try again.'
      };
      const errorCode = urlParams.get('error');
      if (errorCode && ERROR_MESSAGES[errorCode]) {
        loginError.textContent = ERROR_MESSAGES[errorCode];
        loginError.classList.add('visible');
      }

      // Render available OAuth provider buttons
      const PROVIDER_META = {
        google: {
          label: 'Continue with Google',
          icon: '<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>'
        },
        apple: {
          label: 'Continue with Apple',
          icon: '<svg width="16" height="18" viewBox="0 0 16 18" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M13.29 9.54c-.02-2.02 1.65-2.99 1.72-3.04-.94-1.37-2.4-1.56-2.92-1.58-1.24-.13-2.42.73-3.05.73-.63 0-1.6-.71-2.63-.69-1.35.02-2.6.79-3.29 2-1.4 2.43-.36 6.03 1 8.01.67.97 1.46 2.06 2.5 2.02 1-.04 1.38-.65 2.6-.65 1.21 0 1.55.65 2.61.63 1.08-.02 1.76-.99 2.42-1.96.76-1.12 1.08-2.2 1.09-2.26-.02-.01-2.09-.8-2.11-3.18zM11.3 3.6c.55-.67.93-1.6.82-2.53-.8.03-1.77.53-2.34 1.2-.51.59-.96 1.54-.84 2.44.89.07 1.8-.45 2.36-1.11z"/></svg>'
        },
        vipps: {
          label: 'Continue with',
          icon: '<span class="vipps-badge">Vipps</span>'
        }
      };

      const oauthButtons = document.getElementById('oauthButtons');
      const oauthDivider = document.getElementById('oauthDivider');
      fetch('/api/auth/providers')
        .then(res => res.json())
        .then(providers => {
          const available = Object.keys(PROVIDER_META).filter(p => providers[p]);
          if (available.length === 0) return;
          oauthDivider.style.display = 'flex';
          available.forEach(p => {
            const meta = PROVIDER_META[p];
            const a = document.createElement('a');
            a.className = 'oauth-btn';
            // Preserve the requested redirect target across the OAuth round-trip
            const params = new URLSearchParams();
            if (redirectUrl && redirectUrl !== '/') params.set('redirect', redirectUrl);
            a.href = `/api/auth/oauth/${p}/start${params.toString() ? '?' + params.toString() : ''}`;
            a.innerHTML = `${meta.icon}<span>${meta.label}</span>`;
            oauthButtons.appendChild(a);
          });
        })
        .catch(() => {});
      
      // Load saved email from localStorage
      const savedEmail = localStorage.getItem('basketstat_email');
      if (savedEmail) {
        emailInput.value = savedEmail;
      }
      
      // Check if already authenticated
      fetch('/api/auth/check')
        .then(res => res.json())
        .then(data => {
          if (data.authenticated) {
            // If admin is required but user is not admin, stay on login
            if (requiresAdmin && data.role !== 'admin') {
              return;
            }
            window.location.href = redirectUrl;
          }
        })
        .catch(() => {});
      
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        
        if (!email) {
          loginError.textContent = 'Email address is required.';
          loginError.classList.add('visible');
          emailInput.focus();
          return;
        }
        
        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';
        loginError.classList.remove('visible');
        adminError.style.display = 'none';
        
        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          
          const result = await response.json();
          
          if (result.success) {
            // Save email for convenience
            localStorage.setItem('basketstat_email', email);
            
            // Check if admin access is required but user is not admin
            if (requiresAdmin && result.role !== 'admin') {
              adminError.style.display = 'block';
              passwordInput.value = '';
              passwordInput.focus();
              loginBtn.disabled = false;
              loginBtn.textContent = 'Sign In';
              return;
            }
            
            // Force a password change when required
            if (result.mustChange) {
              window.location.href = '/change-password.html?required=1';
              return;
            }

            // Redirect to requested page or dashboard
            window.location.href = redirectUrl;
          } else {
            loginError.textContent = result.error || 'Incorrect password. Please try again.';
            loginError.classList.add('visible');
            passwordInput.value = '';
            passwordInput.focus();
          }
        } catch (error) {
          console.error('Login error:', error);
          loginError.textContent = 'Connection error. Please try again.';
          loginError.classList.add('visible');
        }
        
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      });
      
      // Focus email input if empty, otherwise password
      if (emailInput.value) {
        passwordInput.focus();
      } else {
        emailInput.focus();
      }
    </script>
  </body>
</html>

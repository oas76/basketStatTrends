<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password | BasketStat Trends</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
    <style>
      .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: linear-gradient(135deg, var(--bg) 0%, #0d1117 100%);
      }
      .login-container { width: 100%; max-width: 400px; }
      .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 40px;
        text-align: center;
      }
      .login-logo { font-size: 48px; margin-bottom: 16px; }
      .login-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
      .login-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 32px; }
      .login-form { display: flex; flex-direction: column; gap: 16px; }
      .login-input {
        width: 100%;
        padding: 14px 16px;
        font-size: 15px;
        font-family: inherit;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        color: var(--text);
      }
      .login-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-dim);
      }
      .login-btn {
        width: 100%;
        padding: 14px 24px;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
      }
      .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .login-error {
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid rgba(248, 113, 113, 0.3);
        color: #f87171;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        display: none;
      }
      .login-error.visible { display: block; }
      .login-success {
        background: rgba(74, 222, 128, 0.1);
        border: 1px solid rgba(74, 222, 128, 0.3);
        color: #4ade80;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        display: none;
      }
      .login-success.visible { display: block; }
      .login-footer {
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-muted);
      }
      .login-footer a { color: var(--accent); text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="login-page">
      <div class="login-container">
        <div class="login-card">
          <div class="login-logo">🔑</div>
          <h1 class="login-title">Change Password</h1>
          <p class="login-subtitle" id="subtitle">Set a new password for your account</p>

          <form class="login-form" id="changeForm">
            <input type="password" class="login-input" id="newPassword" placeholder="New password (min 8 characters)" autocomplete="new-password" required minlength="8" />
            <input type="password" class="login-input" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" required minlength="8" />
            <div class="login-error" id="errorBox"></div>
            <div class="login-success" id="successBox"></div>
            <button type="submit" class="login-btn" id="submitBtn">Update Password</button>
          </form>

          <div class="login-footer">
            <a href="/">← Back to dashboard</a>
          </div>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById('changeForm');
      const newPassword = document.getElementById('newPassword');
      const confirmPassword = document.getElementById('confirmPassword');
      const submitBtn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      const successBox = document.getElementById('successBox');
      const subtitle = document.getElementById('subtitle');

      const params = new URLSearchParams(window.location.search);
      if (params.get('required') === '1') {
        subtitle.textContent = 'You must set a new password before continuing.';
      }

      const showError = (msg) => {
        errorBox.textContent = msg;
        errorBox.classList.add('visible');
        successBox.classList.remove('visible');
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.remove('visible');
        successBox.classList.remove('visible');

        if (newPassword.value.length < 8) {
          showError('Password must be at least 8 characters.');
          return;
        }
        if (newPassword.value !== confirmPassword.value) {
          showError('Passwords do not match.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating...';
        try {
          const res = await fetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ newPassword: newPassword.value })
          });
          const result = await res.json();
          if (res.ok && result.success) {
            successBox.textContent = 'Password updated. Redirecting...';
            successBox.classList.add('visible');
            setTimeout(() => { window.location.href = '/'; }, 1200);
          } else {
            showError(result.error || 'Failed to update password.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Update Password';
          }
        } catch (err) {
          showError('Connection error. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
        }
      });
    </script>
  </body>
</html>
